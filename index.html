<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickViral.ai - AI Shorts Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #030107; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="text-white min-h-screen flex flex-col justify-between pb-16">

  <!-- Header -->
  <header class="px-4 py-3 border-b border-white/10 flex items-center justify-between bg-black/40 backdrop-blur-md sticky top-0 z-50">
    <div class="text-xl font-black tracking-tight">
      ⚡ Quick<span class="bg-gradient-to-r from-purple-400 to-rose-500 bg-clip-text text-transparent">Viral</span>
    </div>
    <div class="flex items-center gap-2">
      <div class="px-2.5 py-1 rounded-full bg-amber-500/10 border border-amber-500/40 text-amber-400 text-xs font-bold">
        ⚡ 100 Credits
      </div>
      <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-purple-600 to-pink-500 border border-white flex items-center justify-center text-[10px] font-black">
        AR
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-md mx-auto w-full px-3 py-3 space-y-4 flex-1">
    
    <!-- Upload Box -->
    <div class="bg-[#120a22]/90 border border-purple-500/30 rounded-xl p-4 shadow-xl text-center">
      <div class="w-12 h-12 mx-auto mb-2 rounded-full bg-purple-500/20 border border-purple-500/40 flex items-center justify-center text-purple-400 text-xl">
        <i class="fa-solid fa-cloud-arrow-up"></i>
      </div>
      <h2 class="text-sm font-black mb-1">Select Video from Phone / PC</h2>
      <p class="text-[10px] text-slate-400 mb-3">अपलोड करें और 1-क्लिक में 9:16 वायरल शॉर्ट्स में बदलें</p>

      <input type="file" id="video-file" accept="video/*" class="hidden" onchange="fileSelected()" />
      
      <button onclick="document.getElementById('video-file').click()" class="w-full bg-[#1b0a33] border border-purple-500/50 hover:border-purple-400 text-purple-200 font-bold py-2 px-3 rounded-lg text-xs mb-2 truncate">
        📁 <span id="file-name">Choose MP4 Video File</span>
      </button>

      <button id="process-btn" onclick="handleUploadAndCut()" class="w-full bg-gradient-to-r from-purple-600 to-rose-500 text-white font-black py-2.5 rounded-lg text-xs flex items-center justify-center gap-2 active:scale-95 transition-all shadow-lg">
        🚀 Convert to 9:16 Short
      </button>

      <div id="status-msg" class="text-[11px] text-purple-300 font-bold mt-2.5 hidden"></div>
    </div>

    <!-- Output Preview (Generated Video) -->
    <div id="result-box" class="hidden bg-[#120a22]/90 border border-purple-500/50 rounded-xl p-3 shadow-xl space-y-2">
      <div class="flex items-center justify-between text-xs font-bold text-emerald-400">
        <span>✅ 9:16 Short Generated!</span>
        <span class="text-[10px] bg-purple-900/60 px-2 py-0.5 rounded text-white">Full HD</span>
      </div>
      <div class="flex justify-center bg-black rounded-lg overflow-hidden border border-white/10 max-h-72">
        <video id="preview-video" controls class="h-64 object-contain"></video>
      </div>
      <a id="download-anchor" href="#" download="QuickViral_Short.mp4" class="block text-center w-full bg-emerald-500 hover:bg-emerald-400 text-black font-black py-2 rounded-lg text-xs active:scale-95 transition-all">
        ⬇ Download 9:16 MP4 Video
      </a>
    </div>

    <!-- Upgrade Box -->
    <div class="bg-gradient-to-br from-[#1b0a30] to-[#350842] border border-purple-600/70 rounded-lg p-3 flex items-center justify-between">
      <div>
        <span class="bg-amber-500/20 text-amber-400 text-[7px] font-black px-1.5 py-0.5 rounded">⚡ VIP PRO ACCESS</span>
        <div class="text-sm font-black text-white mt-0.5">₹99 <span class="text-[8px] font-normal text-slate-300">/month</span></div>
        <div class="text-[7.5px] text-purple-200">Unlimited 4K Viral Exports • No Watermark</div>
      </div>
      <a href="upi://pay?pa=a.rajana@ptyes&pn=QuickViral&am=99.00&cu=INR&tn=QuickViral_Pro_Subscription" class="bg-white text-black font-black py-1.5 px-3 rounded-lg text-xs active:scale-95 transition-all shadow-lg">
        Upgrade ₹99 →
      </a>
    </div>

  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 h-11 bg-[#05020a]/95 border-t border-purple-950 flex items-center justify-around z-50 text-[8px]">
    <div class="text-purple-400 font-bold flex flex-col items-center"><i class="fa-solid fa-clapperboard text-xs"></i><span>Studio</span></div>
    <div class="text-slate-500 flex flex-col items-center"><i class="fa-solid fa-folder text-xs"></i><span>Library</span></div>
    <div class="text-slate-500 flex flex-col items-center"><i class="fa-solid fa-robot text-xs"></i><span>Copilot</span></div>
    <a href="upi://pay?pa=a.rajana@ptyes&pn=QuickViral&am=99.00&cu=INR&tn=QuickViral_Pro_Subscription" class="text-slate-500 flex flex-col items-center"><i class="fa-solid fa-credit-card text-xs"></i><span>Pro (₹99)</span></a>
    <div class="text-slate-500 flex flex-col items-center"><i class="fa-solid fa-user text-xs"></i><span>Profile</span></div>
  </nav>

  <script>
    function fileSelected() {
      const fileInput = document.getElementById('video-file');
      if (fileInput.files.length > 0) {
        document.getElementById('file-name').innerText = fileInput.files[0].name;
      }
    }

    async function handleUploadAndCut() {
      const fileInput = document.getElementById('video-file');
      const statusMsg = document.getElementById('status-msg');
      const btn = document.getElementById('process-btn');
      const resultBox = document.getElementById('result-box');
      const previewVideo = document.getElementById('preview-video');
      const downloadAnchor = document.getElementById('download-anchor');

      if (!fileInput.files.length) {
        alert('कृपया पहले अपने फोन/कंप्यूटर से कोई वीडियो सेलेक्ट करें!');
        return;
      }

      const file = fileInput.files[0];
      const formData = new FormData();
      formData.append('file', file);

      btn.disabled = true;
      btn.innerText = '⏳ Processing 9:16 Short...';
      statusMsg.classList.remove('hidden');
      statusMsg.innerText = '⚡ वीडियो अपलोड हो रही है और FFmpeg 9:16 में क्रॉप कर रहा है (20-30 सेकंड)...';
      resultBox.classList.add('hidden');

      try {
        const response = await fetch('https://quickviral-ai.onrender.com/upload-cut', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.detail || 'प्रोसेसिंग में एरर आया');
        }

        const blob = await response.blob();
        const videoUrl = URL.createObjectURL(blob);

        // प्रीव्यू और डाउनलोड बटन एक्टिव करना
        previewVideo.src = videoUrl;
        downloadAnchor.href = videoUrl;
        downloadAnchor.download = `QuickViral_${Date.now()}.mp4`;

        resultBox.classList.remove('hidden');
        statusMsg.innerText = '🎉 आपकी 9:16 शॉर्ट वीडियो तैयार है!';

        // ऑटोमैटिक डाउनलोड ट्रिगर
        downloadAnchor.click();

      } catch (err) {
        statusMsg.innerText = '❌ एरर: ' + err.message;
        alert('एरर: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = '🚀 Convert to 9:16 Short';
      }
    }
  </script>
</body>
</html>
